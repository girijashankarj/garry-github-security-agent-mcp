name: Claude Security Audit

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        required: true
        default: 'deterministic'
        type: choice
        options:
          - claude-code
          - deterministic
          - batch

permissions:
  contents: write
  pull-requests: write
  security-events: read
  actions: read

jobs:
  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITHUB_OWNER: ${{ vars.GITHUB_OWNER }}
      SECURITY_AUDIT_MAX_REPO_WORKERS: ${{ vars.SECURITY_AUDIT_MAX_REPO_WORKERS || '10' }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-4-5' }}
      GITHUB_TOKEN: ${{ secrets.SECURITY_AUDIT_GITHUB_TOKEN || github.token }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout audit tool
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Repository consistency check
        run: node scripts/consistency-check.mjs

      - name: Type check
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Baseline security audit
        run: node scripts/audit-security.mjs > baseline-security.json

      - name: Claude Code non-interactive audit
        if: ${{ inputs.mode == 'claude-code' }}
        run: |
          if ! command -v claude >/dev/null 2>&1; then
            echo 'Claude Code CLI is not installed on this runner.'
            echo 'Install and pin the Claude Code CLI according to your organisation policy.'
            exit 1
          fi
          claude -p "Use this repository's security-audit skill and configuration. Read baseline-security.json. Follow the operator-approved workflow. Use deterministic scripts for GitHub operations and verification. Never expose credentials and never auto-merge." --max-turns 30

      - name: Deterministic audit
        if: ${{ inputs.mode == 'deterministic' }}
        run: npm run audit

      - name: Batch mode boundary
        if: ${{ inputs.mode == 'batch' }}
        run: |
          echo 'Batch mode is an adapter boundary.'
          echo 'Implement and configure the approved Anthropic Batch API adapter before enabling unattended batch execution.'
          exit 1

      - name: Upload baseline report
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-baseline-${{ github.run_id }}
          path: baseline-security.json
